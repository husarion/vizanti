<canvas id="{uniqueID}_canvas" style="pointer-events: none; z-index: 2;"></canvas>

<!-- Mission Select Window (hidden by default) -->
<div id="{uniqueID}_mission_window" class="window noselect" style="display:none;">
  <h3>Navigator Mission Selector</h3>

  <button id="{uniqueID}_mission_window_close" class="window_close" title="Close">&#10005;</button>

  <div id="{uniqueID}_mission_drag_handle" class="window_drag_handle"></div>

  <p id="{uniqueID}_mission_status" class="status">Status: Ok.</p>

  <hr class="dark_hr" />

  <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
    <label for="{uniqueID}_mission_node_name">Node Name:</label>
    <input id="{uniqueID}_mission_node_name" type="text">
  </div>

  <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
    <label for="{uniqueID}_fixed_frame">Fixed Frame:</label>
    <select id="{uniqueID}_fixed_frame" name="topic">
      <option value="map">map</option>
    </select>
  </div>

  <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
    <label for="{uniqueID}_mission_select">Mission:</label>
    <select id="{uniqueID}_mission_select" style="flex: 1;">
      <option value="">-- Select Mission --</option>
    </select>
  </div>

  <div class="spacer"></div>

  <button id="{uniqueID}_clear_path" style="background-color: rgb(104, 78, 31);">Clear Path</button>

  <div class="spacer"></div>
</div>
