<div id="{uniqueID}_modal" class="modal_outer noselect">
	<div class="modal_inner noselect">
		<h3>Manager</h3>

		<p id="{uniqueID}_status" class="status">Status: Ok.</p>

		<hr class="dark_hr" />

		<label for="{uniqueID}_nodename">Navigation Manager Node Name:</label>
		<input id="{uniqueID}_nodename" type="text" value="navigation_manager">

		<hr class="dark_hr" />

		<button id="{uniqueID}_remove" class="delete_button" onclick="removeWidget('{uniqueID}')">Remove Widget</button>

	</div>
</div>

<!-- Mission Select Modal (hidden by default) -->
<div id="{uniqueID}_mission_modal" class="modal_outer noselect" style="display:none;">
	<div class="modal_inner noselect">
		<h3>Mission Import</h3>

		<p id="{uniqueID}_mission_status" class="status">Status: Ok.</p>

		<hr class="dark_hr" />

		<label for="{uniqueID}_fixed_frame">Fixed Frame:</label>
		<select id="{uniqueID}_fixed_frame" name="topic">
			<option value="map">map</option>
		</select>

		<div class="spacer"></div>

		<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
			<label for="{uniqueID}_mission_select">Mission:</label>
			<select id="{uniqueID}_mission_select" style="flex: 1;">
				<option value="">-- Select Mission --</option>
			</select>
			<button id="{uniqueID}_load_mission" style="background-color: rgb(31, 52, 78);">Load</button>
		</div>

		<label>Use GPS coordinates:</label>
		<input type="checkbox" id="{uniqueID}_use_gps_coordinates">

		<div id="{uniqueID}_gps_service_container" style="display: none; margin-top: 10px;">
			<div class="spacer"></div>
			<label for="{uniqueID}_gps_import_service">GPS Import Service:</label>
			<select id="{uniqueID}_gps_import_service" name="gps_import_service">
				<option value="/fromLLArray">/fromLLArray</option>
			</select>
		</div>

		<div class="spacer"></div>

		<div style="display: flex; gap: 10px; align-items: center;">
			<input type="file" id="{uniqueID}_import_input" accept=".json" style="display: none;">
			<button id="{uniqueID}_import">⇓ Import</button>
		</div>

		<div class="spacer"></div>

		<button id="{uniqueID}_clear_path" style="background-color: rgb(104, 78, 31);">Clear Path</button>

		<div class="spacer"></div>
	</div>
</div>
